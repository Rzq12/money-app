# Flutter app in mobile/: analyze and test, then build an Android debug APK and an unsigned iOS
# simulator build. Uses the same Supabase secrets as the web build (VITE_SUPABASE_URL / _ANON_KEY).
name: Flutter

on:
  workflow_dispatch:
  pull_request:
    paths: ['mobile/**', '.github/workflows/flutter.yml']
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/flutter.yml']

defaults:
  run:
    working-directory: mobile

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter build apk --debug --dart-define=SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: kasku-flutter-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk

  ios:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Plugins (connectivity_plus) use iOS 26 SDK APIs; the image's default Xcode is older.
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - run: xcodebuild -version
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter build ios --simulator --debug --no-codesign --dart-define=SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
