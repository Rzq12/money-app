# Publishes a signed Android APK as a GitHub Release when a version tag is pushed:
#   git tag v1.2.0 && git push origin v1.2.0
# The release "Kasku+ 1.2.0" then carries kasku-plus-1.2.0.apk, ready to download and install.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY   database the app connects to
#   ANDROID_KEYSTORE_BASE64                      release keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Release APK

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write # create the release and upload the APK

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          missing=""
          [ -n "$KS" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$VITE_SUPABASE_URL" ] || missing="$missing VITE_SUPABASE_URL"
          [ -n "$VITE_SUPABASE_ANON_KEY" ] || missing="$missing VITE_SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      # v1.2.3 -> versionName 1.2.3, versionCode 10203 (always higher for a newer tag while each part stays below 100).
      - name: Version from tag
        id: v
        run: |
          name="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$name"
          if [ "$minor" -ge 100 ] || [ "$patch" -ge 100 ]; then echo "::error::Minor and patch must be below 100"; exit 1; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - run: npm ci
      - run: npm run mobile:sync

      - name: Build signed APK
        working-directory: android
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KASKU_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KASKU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KASKU_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KASKU_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > "$KASKU_KEYSTORE_FILE"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PversionCode=${{ steps.v.outputs.code }} -PversionName=${{ steps.v.outputs.name }}
          rm -f "$KASKU_KEYSTORE_FILE"

      - name: Verify signature
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "$apk"
          cp "$apk" "kasku-plus-${{ steps.v.outputs.name }}.apk"
          sha256sum "kasku-plus-${{ steps.v.outputs.name }}.apk" > "kasku-plus-${{ steps.v.outputs.name }}.apk.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "kasku-plus-${{ steps.v.outputs.name }}.apk" \
            "kasku-plus-${{ steps.v.outputs.name }}.apk.sha256" \
            --title "Kasku+ ${{ steps.v.outputs.name }}" \
            --generate-notes
